mission:
  name: qed-05-integration-validation
  goal: End-to-end verification with real Lean compiler

tasks:
  - Test all examples from README against actual Lean 4
  - Verify traces.json written correctly for success AND failure
  - Confirm no false positives (sorry = failure)

context_files:
  - agentic_pipeline.py
  - parser.py
  - test_pipeline.py
  - README.md
  - IMPLEMENTATION_PLAN.md

verification:
  commands:
    - python3 run_tests.py
    - python3 -m pytest test_pipeline.py -v
  probes:
    - command: python3 check_sorry.py true
      contains: "True"
    - command: python3 check_sorry.py false
      contains: "False"
    - command: python3 check_parser.py pre_paren
      contains: "2 * (a+b)"
    - command: python3 check_parser.py post_paren
      contains: "(a+b) * (c+d)"
    - command: python3 check_parser.py chain
      contains: "3 * x * y * z"
    - command: python3 check_type.py int
      contains: "Int"
    - command: python3 check_type.py rat
      contains: "Rat"
    - command: python3 check_type.py annotation
      contains: ": Int"
    - command: python3 check_tactic.py algebraic
      contains: "ring"
    - command: python3 check_tactic.py inequality
      contains: "linarith"
    - command: python3 check_tactic.py ring_goal
      contains: "ring"
  clean_room: true

recovery:
  max_attempts: 3

review:
  enabled: false

budget:
  max_sends: 10
  max_wall_seconds: 900

adapter: opencode
git_state_guard: true
