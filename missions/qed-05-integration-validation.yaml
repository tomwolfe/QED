mission:
  name: qed-05-integration-validation
  goal: Verify end-to-end integration with real Lean compiler works correctly

tasks:
  - Verify all tests pass with real Lean compiler
  - Confirm no sorry in any generated output
  - Verify traces.json is written correctly

context_files:
  - agentic_pipeline.py
  - parser.py
  - test_pipeline.py
  - README.md
  - IMPLEMENTATION_PLAN.md

verification:
  commands:
    - python3 run_tests.py
    - python3 -m pytest test_pipeline.py -v
  probes:
    - command: python3 check_integration.py
      contains: "INTEGRATION OK"
  clean_room: true

recovery:
  max_attempts: 2

review:
  enabled: false

budget:
  max_sends: 8
  max_wall_seconds: 600

adapter: opencode
git_state_guard: true
