mission:
  name: qed-03-type-inference
  goal: Implement context-aware type selection in agentic_pipeline.py

tasks:
  - Improve _suggest_type and _get_var_type to handle mixed expressions
  - Add division detection to Rat type
  - Add negative literal detection to Int type
  - Generate proper type annotations in Lean output

context_files:
  - agentic_pipeline.py
  - test_pipeline.py
  - IMPLEMENTATION_PLAN.md

constraints:
  - "DO NOT create any git commits. Leave every change in the working tree, uncommitted. This mission runs with git_state_guard: true, which compares the repo HEAD against a checkpoint taken at session start; a commit made during the session is reported as 'history was rewritten' and the mission fails with verification skipped -- even when the work is correct and the tests pass. The guard is strict on purpose, so the fix is to not commit."

verification:
  commands:
    - python3 -m pytest test_pipeline.py -v
  probes:
    - command: python3 check_type.py int
      contains: "Int"
    - command: python3 check_type.py rat
      contains: "Rat"
    - command: python3 check_type.py annotation
      contains: ": Int"
  clean_room: true

recovery:
  max_attempts: 3

review:
  enabled: false

budget:
  max_sends: 24
  max_wall_seconds: 5400
adapter: opencode
git_state_guard: true
